const { useState, useEffect, useMemo, useRef } = React;
const {
  ResponsiveContainer,
  LineChart,
  Line,
  XAxis,
  YAxis,
  CartesianGrid,
  Tooltip,

} = Recharts;

// ---------- Constants ----------
const DEFAULT_TRADES = ["Pipe", "Structural", "Electrical", "Paint & Sound Dampening", "Sheetmetal", "OSM"];
const DEFAULT_WEIGHTS = { schedule: 30, efficiency: 40, quality: 15, safety: 15 };
const WEIGHTS_STORAGE_KEY = "module4-dashboard:weights";
const TRADES_STORAGE_KEY = "module4-dashboard:trades";
const WEEK_COUNT = 12;

function ragForScore(score) {
  if (score >= 90) return "green";
  if (score >= 75) return "amber";
  return "red";
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

// ---------- Mock data generation ----------
function mulberry32(seed) {
  let a = seed;
  return function random() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const HULLS = ["Hull 201", "Hull 202", "Hull 203", "Hull 204"];
const SUPERVISORS_BY_TRADE = {
  Pipe: ["M. Alvarez", "J. Cho"],
  Structural: ["R. Whitfield", "T. Boudreaux"],
  Electrical: ["S. Okafor", "D. Lindgren"],
  "Paint & Sound Dampening": ["K. Marsh"],
  Sheetmetal: ["P. Nakamura"],
  OSM: ["A. Delgado"],
};
const WORK_PACKAGES_BY_TRADE = {
  Pipe: ["WP-M4-PIP-01", "WP-M4-PIP-02", "WP-M4-PIP-03"],
  Structural: ["WP-M4-STR-01", "WP-M4-STR-02"],
  Electrical: ["WP-M4-ELE-01", "WP-M4-ELE-02"],
  "Paint & Sound Dampening": ["WP-M4-PSD-01"],
  Sheetmetal: ["WP-M4-SHT-01"],
  OSM: ["WP-M4-OSM-01"],
};

function isoMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

function weeksAgo(n, from) {
  const d = new Date(from);
  d.setDate(d.getDate() - n * 7);
  return d;
}

function generateMockData(weekCount, trades) {
  const rand = mulberry32(20260810);
  const records = [];
  const today = new Date();
  const baseline = new Map();

  for (let w = weekCount - 1; w >= 0; w--) {
    const week = isoMonday(weeksAgo(w, today));

    for (const hull of HULLS) {
      for (const trade of trades) {
        const supervisors = SUPERVISORS_BY_TRADE[trade] || [`${trade} Supervisor`];
        const workPackages = WORK_PACKAGES_BY_TRADE[trade] || [`WP-M4-${trade.slice(0, 3).toUpperCase()}-01`];

        supervisors.forEach((supervisor, sIdx) => {
          ["Day", "Night"].forEach((shift) => {
            const crew = `${trade.slice(0, 3).toUpperCase()}-${shift[0]}${sIdx + 1}`;
            const key = `${hull}__${supervisor}__${crew}`;

            if (!baseline.has(key)) {
              baseline.set(key, { skill: 0.82 + rand() * 0.34, startPct: 8 + rand() * 12 });
            }
            const base = baseline.get(key);

            const crewSize = shift === "Day" ? 6 + Math.floor(rand() * 8) : 4 + Math.floor(rand() * 6);
            const weeksElapsed = weekCount - 1 - w;
            const targetPercentComplete = Math.min(98, base.startPct + weeksElapsed * (5 + rand() * 1.5));
            const driftNoise = (rand() - 0.5) * 8;
            const actualPercentComplete = Math.max(
              0,
              Math.min(100, targetPercentComplete + driftNoise * (2 - base.skill))
            );

            const budgetedHours = crewSize * (32 + rand() * 8);
            const actualHours = budgetedHours * (0.85 + rand() * 0.3);
            const earnedHours = actualHours * base.skill * (0.9 + rand() * 0.2);

            const inspectionsPerformed = 2 + Math.floor(rand() * 6);
            const rejectionChance = base.skill < 0.95 ? 0.28 : 0.08;
            const inspectionsRejected = Array.from({ length: inspectionsPerformed }).filter(
              () => rand() < rejectionChance
            ).length;

            const safetyIncidents = rand() < 0.04 ? 1 : 0;

            records.push({
              id: `${key}__${week}`,
              week,
              hull,
              module: "Module 4",
              trade,
              supervisor,
              shift,
              crew,
              workPackage: workPackages[Math.floor(rand() * workPackages.length)],
              crewSize,
              targetPercentComplete: Math.round(targetPercentComplete * 10) / 10,
              actualPercentComplete: Math.round(actualPercentComplete * 10) / 10,
              budgetedHours: Math.round(budgetedHours),
              earnedHours: Math.round(earnedHours),
              actualHours: Math.round(actualHours),
              inspectionsPerformed,
              inspectionsRejected,
              safetyIncidents,
            });
          });
        });
      }
    }
  }

  return records;
}

// ---------- Scoring ----------
function scoreRecord(record, weights) {
  const actualHours = record.actualHours || 0;
  const earnedHours = record.earnedHours || 0;
  const crewSize = record.crewSize || 1;

  const performanceFactor = actualHours > 0 ? earnedHours / actualHours : 0;
  const earnedHoursPerPerson = earnedHours / crewSize;
  const actualHoursPerPerson = actualHours / crewSize;
  const scheduleVariancePts = record.actualPercentComplete - record.targetPercentComplete;

  const qualityRate =
    record.inspectionsPerformed > 0
      ? ((record.inspectionsPerformed - record.inspectionsRejected) / record.inspectionsPerformed) * 100
      : 100;

  const scheduleScore = clamp(100 + scheduleVariancePts * 4, 0, 100);
  const efficiencyScore = clamp(performanceFactor * 100, 0, 100);
  const qualityScore = clamp(qualityRate, 0, 100);
  const incidentRate = (record.safetyIncidents / crewSize) * 100;
  const safetyScore = clamp(100 - incidentRate * 4, 0, 100);

  const totalWeight = weights.schedule + weights.efficiency + weights.quality + weights.safety || 1;
  const compositeScore =
    (scheduleScore * weights.schedule +
      efficiencyScore * weights.efficiency +
      qualityScore * weights.quality +
      safetyScore * weights.safety) /
    totalWeight;

  return {
    ...record,
    performanceFactor,
    earnedHoursPerPerson,
    actualHoursPerPerson,
    scheduleVariancePts,
    qualityRate,
    scheduleScore,
    efficiencyScore,
    qualityScore,
    safetyScore,
    compositeScore,
  };
}

// ---------- Aggregation / ranking ----------
function uniqueJoin(values) {
  const unique = Array.from(new Set(values));
  if (unique.length === 1) return unique[0];
  if (unique.length <= 3) return unique.join(", ");
  return `${unique.length} groups`;
}

function weightedAverage(bucket, selector, totalWeight) {
  const sum = bucket.reduce((acc, r) => acc + selector(r) * r.budgetedHours, 0);
  return sum / totalWeight;
}

function dimensionValue(record, dimension) {
  if (dimension === "supervisor") return record.supervisor;
  if (dimension === "crew") return record.crew;
  if (dimension === "trade") return record.trade;
  return record.hull;
}

function aggregateAll(records, weights) {
  if (records.length === 0) return null;
  const totalBudgeted = records.reduce((sum, r) => sum + r.budgetedHours, 0) || 1;

  const aggregate = {
    id: "summary",
    week: records[0].week,
    hull: uniqueJoin(records.map((r) => r.hull)),
    module: records[0].module,
    trade: uniqueJoin(records.map((r) => r.trade)),
    supervisor: uniqueJoin(records.map((r) => r.supervisor)),
    shift: records[0].shift,
    crew: uniqueJoin(records.map((r) => r.crew)),
    workPackage: uniqueJoin(records.map((r) => r.workPackage)),
    crewSize: records.reduce((sum, r) => sum + r.crewSize, 0),
    targetPercentComplete: weightedAverage(records, (r) => r.targetPercentComplete, totalBudgeted),
    actualPercentComplete: weightedAverage(records, (r) => r.actualPercentComplete, totalBudgeted),
    budgetedHours: records.reduce((sum, r) => sum + r.budgetedHours, 0),
    earnedHours: records.reduce((sum, r) => sum + r.earnedHours, 0),
    actualHours: records.reduce((sum, r) => sum + r.actualHours, 0),
    inspectionsPerformed: records.reduce((sum, r) => sum + r.inspectionsPerformed, 0),
    inspectionsRejected: records.reduce((sum, r) => sum + r.inspectionsRejected, 0),
    safetyIncidents: records.reduce((sum, r) => sum + r.safetyIncidents, 0),
  };

  return scoreRecord(aggregate, weights);
}

function groupAndScore(records, dimension, weights) {
  const buckets = new Map();

  for (const record of records) {
    const label = dimensionValue(record, dimension);
    const key = `${record.week}__${label}`;
    const bucket = buckets.get(key);
    if (bucket) bucket.push(record);
    else buckets.set(key, [record]);
  }

  const grouped = [];

  for (const [key, bucket] of buckets.entries()) {
    const label = dimensionValue(bucket[0], dimension);
    const totalBudgeted = bucket.reduce((sum, r) => sum + r.budgetedHours, 0) || 1;

    const aggregate = {
      id: key,
      week: bucket[0].week,
      hull: dimension === "hull" ? label : uniqueJoin(bucket.map((r) => r.hull)),
      module: bucket[0].module,
      trade: dimension === "trade" ? label : uniqueJoin(bucket.map((r) => r.trade)),
      supervisor: dimension === "supervisor" ? label : uniqueJoin(bucket.map((r) => r.supervisor)),
      shift: bucket[0].shift,
      crew: dimension === "crew" ? label : uniqueJoin(bucket.map((r) => r.crew)),
      workPackage: uniqueJoin(bucket.map((r) => r.workPackage)),
      crewSize: bucket.reduce((sum, r) => sum + r.crewSize, 0),
      targetPercentComplete: weightedAverage(bucket, (r) => r.targetPercentComplete, totalBudgeted),
      actualPercentComplete: weightedAverage(bucket, (r) => r.actualPercentComplete, totalBudgeted),
      budgetedHours: bucket.reduce((sum, r) => sum + r.budgetedHours, 0),
      earnedHours: bucket.reduce((sum, r) => sum + r.earnedHours, 0),
      actualHours: bucket.reduce((sum, r) => sum + r.actualHours, 0),
      inspectionsPerformed: bucket.reduce((sum, r) => sum + r.inspectionsPerformed, 0),
      inspectionsRejected: bucket.reduce((sum, r) => sum + r.inspectionsRejected, 0),
      safetyIncidents: bucket.reduce((sum, r) => sum + r.safetyIncidents, 0),
    };

    const scored = scoreRecord(aggregate, weights);
    grouped.push({ ...scored, groupKey: key, groupLabel: label, rank: 0, recordCount: bucket.length });
  }

  const byWeek = new Map();
  for (const g of grouped) {
    const arr = byWeek.get(g.week);
    if (arr) arr.push(g);
    else byWeek.set(g.week, [g]);
  }

  for (const arr of byWeek.values()) {
    arr.sort((a, b) => b.compositeScore - a.compositeScore);
    arr.forEach((g, index) => (g.rank = index + 1));
  }

  return grouped.sort((a, b) => (a.week === b.week ? a.rank - b.rank : a.week < b.week ? 1 : -1));
}

// ---------- CSV ----------
const REQUIRED_COLUMNS = [
  "week", "hull", "trade", "supervisor", "crew", "crewSize",
  "targetPercentComplete", "actualPercentComplete", "budgetedHours", "earnedHours", "actualHours",
];

function num(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function findKey(row, name) {
  const lower = name.toLowerCase();
  return Object.keys(row).find((k) => k.trim().toLowerCase() === lower);
}

function parseCsv(csvText) {
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true, dynamicTyping: false });
  const errors = parsed.errors.map((e) => `Row ${e.row ?? "?"}: ${e.message}`);

  if (parsed.data.length === 0) {
    return { records: [], errors: [...errors, "No data rows found in file."] };
  }

  const headerKeys = Object.keys(parsed.data[0]);
  const missing = REQUIRED_COLUMNS.filter(
    (col) => !headerKeys.some((k) => k.trim().toLowerCase() === col.toLowerCase())
  );
  if (missing.length > 0) errors.push(`Missing expected column(s): ${missing.join(", ")}`);

  const records = parsed.data.map((row, index) => {
    const get = (name) => {
      const key = findKey(row, name);
      return key ? String(row[key] ?? "").trim() : "";
    };
    const shiftRaw = get("shift");
    const shift = shiftRaw.toLowerCase().startsWith("n") ? "Night" : "Day";

    return {
      id: `csv-${index}-${get("week")}-${get("hull")}-${get("trade")}-${get("crew")}`,
      week: get("week"),
      hull: get("hull"),
      module: get("module") || "Module 4",
      trade: get("trade"),
      supervisor: get("supervisor"),
      shift,
      crew: get("crew"),
      workPackage: get("workPackage") || get("work package") || "",
      crewSize: num(get("crewSize"), 1),
      targetPercentComplete: num(get("targetPercentComplete")),
      actualPercentComplete: num(get("actualPercentComplete")),
      budgetedHours: num(get("budgetedHours")),
      earnedHours: num(get("earnedHours")),
      actualHours: num(get("actualHours")),
      inspectionsPerformed: num(get("inspectionsPerformed")),
      inspectionsRejected: num(get("inspectionsRejected")),
      safetyIncidents: num(get("safetyIncidents")),
    };
  });

  return { records, errors };
}

function downloadSampleCsvTemplate() {
  const header = [
    "week", "hull", "module", "trade", "supervisor", "shift", "crew", "workPackage", "crewSize",
    "targetPercentComplete", "actualPercentComplete", "budgetedHours", "earnedHours", "actualHours",
    "inspectionsPerformed", "inspectionsRejected", "safetyIncidents",
  ];
  const example = [
    "2026-08-03", "Hull 201", "Module 4", "Pipe", "M. Alvarez", "Day", "PIP-D1", "WP-M4-PIP-01",
    "8", "42", "40", "320", "290", "310", "5", "1", "0",
  ];
  return `${header.join(",")}\n${example.join(",")}\n`;
}

function formatWeekLabel(weekIso) {
  const d = new Date(`${weekIso}T00:00:00`);
  if (Number.isNaN(d.getTime())) return weekIso;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function uniqueSorted(values) {
  return Array.from(new Set(values)).sort();
}

function loadFromStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

// ---------- Components ----------
function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const containerRef = useRef(null);

  useEffect(() => {
    function handleClickOutside(event) {
      if (containerRef.current && !containerRef.current.contains(event.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  function toggle(option) {
    if (selected.includes(option)) onChange(selected.filter((o) => o !== option));
    else onChange([...selected, option]);
  }

  const buttonLabel =
    selected.length === 0 ? `All ${label}` : selected.length === 1 ? selected[0] : `${selected.length} ${label} selected`;

  return (
    <div className="relative" ref={containerRef}>
      <label className="mb-1 block text-xs font-medium text-slate-500">{label}</label>
      <button
        type="button"
        onClick={() => setOpen((o) => !o)}
        className="flex w-full min-w-[9rem] items-center justify-between gap-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 shadow-sm hover:border-slate-400"
      >
        <span className="truncate">{buttonLabel}</span>
        <span className="text-slate-400">▾</span>
      </button>
      {open && (
        <div className="absolute z-20 mt-1 max-h-64 w-56 overflow-auto rounded-md border border-slate-200 bg-white p-2 shadow-lg">
          <div className="mb-1 flex justify-between border-b border-slate-100 pb-1 text-xs">
            <button className="text-blue-600 hover:underline" onClick={() => onChange(options)}>Select all</button>
            <button className="text-slate-500 hover:underline" onClick={() => onChange([])}>Clear</button>
          </div>
          {options.map((option) => (
            <label key={option} className="flex cursor-pointer items-center gap-2 rounded px-1.5 py-1 text-sm text-slate-700 hover:bg-slate-50">
              <input type="checkbox" checked={selected.includes(option)} onChange={() => toggle(option)} className="h-3.5 w-3.5 accent-blue-600" />
              <span className="truncate">{option}</span>
            </label>
          ))}
          {options.length === 0 && <div className="px-1.5 py-1 text-sm text-slate-400">No options</div>}
        </div>
      )}
    </div>
  );
}

const RANK_OPTIONS = [
  { value: "supervisor", label: "Supervisor" },
  { value: "crew", label: "Crew" },
  { value: "trade", label: "Trade" },
  { value: "hull", label: "Hull" },
];

function FilterBar({ filters, onFiltersChange, weeks, hulls, trades, supervisors, workPackages, rankBy, onRankByChange, onOpenSettings }) {
  function patch(partial) {
    onFiltersChange({ ...filters, ...partial });
  }

  const hasActiveFilters =
    filters.hulls.length > 0 || filters.trades.length > 0 || filters.supervisors.length > 0 ||
    filters.shifts.length > 0 || filters.workPackages.length > 0 || filters.weekStart !== null || filters.weekEnd !== null;

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <div className="flex flex-wrap items-end gap-3">
        <MultiSelect label="Hull" options={hulls} selected={filters.hulls} onChange={(v) => patch({ hulls: v })} />
        <MultiSelect label="Trade" options={trades} selected={filters.trades} onChange={(v) => patch({ trades: v })} />
        <MultiSelect label="Supervisor" options={supervisors} selected={filters.supervisors} onChange={(v) => patch({ supervisors: v })} />
        <MultiSelect label="Shift" options={["Day", "Night"]} selected={filters.shifts} onChange={(v) => patch({ shifts: v })} />
        <MultiSelect label="Work Package" options={workPackages} selected={filters.workPackages} onChange={(v) => patch({ workPackages: v })} />

        <div>
          <label className="mb-1 block text-xs font-medium text-slate-500">From week</label>
          <select className="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 shadow-sm" value={filters.weekStart ?? ""} onChange={(e) => patch({ weekStart: e.target.value || null })}>
            <option value="">Earliest</option>
            {weeks.map((w) => <option key={w} value={w}>{w}</option>)}
          </select>
        </div>

        <div>
          <label className="mb-1 block text-xs font-medium text-slate-500">To week</label>
          <select className="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 shadow-sm" value={filters.weekEnd ?? ""} onChange={(e) => patch({ weekEnd: e.target.value || null })}>
            <option value="">Latest</option>
            {weeks.map((w) => <option key={w} value={w}>{w}</option>)}
          </select>
        </div>

        <div>
          <label className="mb-1 block text-xs font-medium text-slate-500">Rank by</label>
          <select className="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 shadow-sm" value={rankBy} onChange={(e) => onRankByChange(e.target.value)}>
            {RANK_OPTIONS.map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
          </select>
        </div>

        <div className="ml-auto flex items-center gap-2">
          {hasActiveFilters && (
            <button
              onClick={() => onFiltersChange({ hulls: [], trades: [], supervisors: [], shifts: [], workPackages: [], weekStart: null, weekEnd: null })}
              className="rounded-md px-3 py-1.5 text-sm text-slate-500 hover:text-slate-700 hover:underline"
            >
              Clear filters
            </button>
          )}
          <button onClick={onOpenSettings} className="rounded-md border border-slate-300 bg-slate-50 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">
            ⚙ Settings
          </button>
        </div>
      </div>
    </div>
  );
}

const RAG_STYLES = {
  green: "bg-emerald-50 text-emerald-700 ring-emerald-200",
  amber: "bg-amber-50 text-amber-700 ring-amber-200",
  red: "bg-red-50 text-red-700 ring-red-200",
};

function ScoreCard({ title, score, detail }) {
  const rag = ragForScore(score);
  return (
    <div className={`rounded-lg p-4 shadow-sm ring-1 ${RAG_STYLES[rag]}`}>
      <div className="text-xs font-medium uppercase tracking-wide opacity-70">{title}</div>
      <div className="mt-1 text-3xl font-semibold">{score.toFixed(0)}</div>
      <div className="mt-1 text-xs opacity-80">{detail}</div>
    </div>
  );
}

function ScorecardSummary({ summary, weekLabel }) {
  if (!summary) {
    return (
      <div className="rounded-lg border border-dashed border-slate-300 bg-white p-6 text-center text-sm text-slate-400">
        No records match the current filters.
      </div>
    );
  }

  return (
    <div>
      <div className="mb-2 flex items-baseline justify-between">
        <h2 className="text-sm font-semibold text-slate-600">Balanced Scorecard — Module 4</h2>
        <span className="text-xs text-slate-400">Week of {weekLabel}</span>
      </div>
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-5">
        <ScoreCard title="Composite" score={summary.compositeScore} detail={`${summary.crewSize} people on crew`} />
        <ScoreCard title="Schedule" score={summary.scheduleScore} detail={`${summary.actualPercentComplete.toFixed(1)}% vs ${summary.targetPercentComplete.toFixed(1)}% target`} />
        <ScoreCard title="Efficiency" score={summary.efficiencyScore} detail={`PF ${summary.performanceFactor.toFixed(2)} · ${summary.earnedHoursPerPerson.toFixed(1)} hrs/person earned`} />
        <ScoreCard title="Quality" score={summary.qualityScore} detail={`${summary.qualityRate.toFixed(0)}% inspections passed`} />
        <ScoreCard title="Safety" score={summary.safetyScore} detail={summary.safetyIncidents === 0 ? "Incident-free" : `${summary.safetyIncidents} incident(s)`} />
      </div>
    </div>
  );
}

      <div className="h-56">{children}</div>

const RAG_DOT = { green: "bg-emerald-500", amber: "bg-amber-500", red: "bg-red-500" };
const DIMENSION_LABEL = { supervisor: "Supervisor", crew: "Crew", trade: "Trade", hull: "Hull" };

function RankingTable({ groups, dimension, week }) {
  const [sortKey, setSortKey] = useState("rank");
  const [sortAsc, setSortAsc] = useState(true);

  const weekGroups = useMemo(() => (week ? groups.filter((g) => g.week === week) : []), [groups, week]);

  const sorted = useMemo(() => {
    const copy = [...weekGroups];
    copy.sort((a, b) => {
      const av = a[sortKey];
      const bv = b[sortKey];
      if (typeof av === "string" && typeof bv === "string") return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      const an = Number(av);
      const bn = Number(bv);
      return sortAsc ? an - bn : bn - an;
    });
    return copy;
  }, [weekGroups, sortKey, sortAsc]);

  function toggleSort(key) {
    if (sortKey === key) setSortAsc((asc) => !asc);
    else {
      setSortKey(key);
      setSortAsc(key === "rank" || key === "groupLabel");
    }
  }

  function headerButton(key, label) {
    const active = sortKey === key;
    return (
      <button onClick={() => toggleSort(key)} className={`flex items-center gap-1 whitespace-nowrap ${active ? "text-slate-900" : "text-slate-500"}`}>
        {label}
        {active && <span className="text-[10px]">{sortAsc ? "▲" : "▼"}</span>}
      </button>
    );
  }

  if (!week || weekGroups.length === 0) {
    return (
      <div className="rounded-lg border border-dashed border-slate-300 bg-white p-6 text-center text-sm text-slate-400">
        No data to rank for this selection.
      </div>
    );
  }

  return (
    <div className="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
      <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <h3 className="text-sm font-semibold text-slate-600">Weekly Ranking by {DIMENSION_LABEL[dimension]} — week of {week}</h3>
        <span className="text-xs text-slate-400">{weekGroups.length} groups</span>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
            <tr>
              <th className="px-3 py-2 text-left">{headerButton("rank", "Rank")}</th>
              <th className="px-3 py-2 text-left">{headerButton("groupLabel", DIMENSION_LABEL[dimension])}</th>
              <th className="px-3 py-2 text-right">{headerButton("crewSize", "Crew Size")}</th>
              <th className="px-3 py-2 text-right">{headerButton("earnedHours", "Earned Hrs")}</th>
              <th className="px-3 py-2 text-right">{headerButton("earnedHoursPerPerson", "Earned Hrs / Person")}</th>
              <th className="px-3 py-2 text-right">{headerButton("actualPercentComplete", "% Complete")}</th>
              <th className="px-3 py-2 text-right">{headerButton("performanceFactor", "Perf. Factor")}</th>
              <th className="px-3 py-2 text-right">{headerButton("qualityScore", "Quality")}</th>
              <th className="px-3 py-2 text-right">{headerButton("safetyScore", "Safety")}</th>
              <th className="px-3 py-2 text-right">{headerButton("compositeScore", "Score")}</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((g) => (
              <tr key={g.groupKey} className="border-t border-slate-100 hover:bg-slate-50">
                <td className="px-3 py-2 font-semibold text-slate-700">#{g.rank}</td>
                <td className="px-3 py-2 text-slate-700">{g.groupLabel}</td>
                <td className="px-3 py-2 text-right text-slate-600">{g.crewSize}</td>
                <td className="px-3 py-2 text-right text-slate-600">{g.earnedHours.toFixed(0)}</td>
                <td className="px-3 py-2 text-right text-slate-600">{g.earnedHoursPerPerson.toFixed(1)}</td>
                <td className="px-3 py-2 text-right text-slate-600">
                  {g.actualPercentComplete.toFixed(1)}%
                  <span className="ml-1 text-xs text-slate-400">({g.scheduleVariancePts >= 0 ? "+" : ""}{g.scheduleVariancePts.toFixed(1)})</span>
                </td>
                <td className="px-3 py-2 text-right text-slate-600">{g.performanceFactor.toFixed(2)}</td>
                <td className="px-3 py-2 text-right text-slate-600">{g.qualityScore.toFixed(0)}</td>
                <td className="px-3 py-2 text-right text-slate-600">{g.safetyScore.toFixed(0)}</td>
                <td className="px-3 py-2 text-right">
                  <span className="inline-flex items-center gap-1.5 font-semibold text-slate-800">
                    <span className={`h-2 w-2 rounded-full ${RAG_DOT[ragForScore(g.compositeScore)]}`} />
                    {g.compositeScore.toFixed(1)}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const WEIGHT_KEYS = [
  { key: "schedule", label: "Schedule", description: "% complete vs. plan" },
  { key: "efficiency", label: "Efficiency", description: "Earned hours ÷ actual hours" },
  { key: "quality", label: "Quality", description: "Inspection pass rate" },
  { key: "safety", label: "Safety", description: "Incident-free performance" },
];

function SettingsPanel({ open, onClose, weights, onWeightsChange, trades, onAddTrade, onRemoveTrade, onImportCsv, onUseMockData, usingImportedData }) {
  const [newTrade, setNewTrade] = useState("");
  const [csvError, setCsvError] = useState(null);
  const fileInputRef = useRef(null);

  if (!open) return null;

  const totalWeight = weights.schedule + weights.efficiency + weights.quality + weights.safety;

  function handleWeightChange(key, value) {
    onWeightsChange({ ...weights, [key]: value });
  }

  function handleAddTrade() {
    const trimmed = newTrade.trim();
    if (trimmed && !trades.includes(trimmed)) {
      onAddTrade(trimmed);
      setNewTrade("");
    }
  }

  function handleFileSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    setCsvError(null);
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "");
      const { records, errors } = parseCsv(text);
      if (errors.length > 0) setCsvError(errors.join(" "));
      if (records.length > 0) onImportCsv(records);
    };
    reader.onerror = () => setCsvError("Could not read the file.");
    reader.readAsText(file);
    event.target.value = "";
  }

  function handleDownloadTemplate() {
    const csv = downloadSampleCsvTemplate();
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "module4-dashboard-template.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-end bg-black/30">
      <div className="h-full w-full max-w-md overflow-y-auto bg-white p-6 shadow-xl">
        <div className="mb-6 flex items-center justify-between">
          <h2 className="text-lg font-semibold text-slate-800">Settings</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        <section className="mb-8">
          <h3 className="mb-1 text-sm font-semibold text-slate-700">Scorecard weights</h3>
          <p className="mb-3 text-xs text-slate-500">
            How much each perspective counts toward the composite score. Current total: {totalWeight}
          </p>
          <div className="space-y-4">
            {WEIGHT_KEYS.map(({ key, label, description }) => (
              <div key={key}>
                <div className="mb-1 flex items-baseline justify-between text-sm">
                  <span className="font-medium text-slate-700">{label}</span>
                  <span className="text-slate-500">{weights[key]}</span>
                </div>
                <input type="range" min={0} max={100} value={weights[key]} onChange={(e) => handleWeightChange(key, Number(e.target.value))} className="w-full accent-blue-600" />
                <div className="text-xs text-slate-400">{description}</div>
              </div>
            ))}
          </div>
        </section>

        <section className="mb-8">
          <h3 className="mb-1 text-sm font-semibold text-slate-700">Trades</h3>
          <p className="mb-3 text-xs text-slate-500">Used as filter options across the dashboard.</p>
          <div className="mb-3 flex flex-wrap gap-2">
            {trades.map((trade) => (
              <span key={trade} className="flex items-center gap-1 rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-700">
                {trade}
                <button onClick={() => onRemoveTrade(trade)} className="text-slate-400 hover:text-red-500">✕</button>
              </span>
            ))}
          </div>
          <div className="flex gap-2">
            <input type="text" value={newTrade} onChange={(e) => setNewTrade(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleAddTrade()} placeholder="Add a trade..." className="flex-1 rounded-md border border-slate-300 px-3 py-1.5 text-sm" />
            <button onClick={handleAddTrade} className="rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-700">Add</button>
          </div>
        </section>

        <section>
          <h3 className="mb-1 text-sm font-semibold text-slate-700">Data source</h3>
          <p className="mb-3 text-xs text-slate-500">
            {usingImportedData ? "Currently showing imported CSV data." : "Currently showing sample data."}
          </p>
          <div className="flex flex-col gap-2">
            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">
              Import CSV...
            </button>
            <input ref={fileInputRef} type="file" accept=".csv" className="hidden" onChange={handleFileSelected} />
            <button onClick={handleDownloadTemplate} className="text-left text-xs text-blue-600 hover:underline">Download CSV template</button>
            {csvError && <p className="text-xs text-red-600">{csvError}</p>}
            {usingImportedData && (
              <button onClick={onUseMockData} className="mt-2 text-left text-xs text-slate-500 hover:underline">Revert to sample data</button>
            )}
          </div>
        </section>
      </div>
    </div>
  );
}

function Header() {
  return (
    <header className="border-b border-slate-200 bg-white px-6 py-4">
      <div className="mx-auto flex max-w-7xl items-center justify-between">
        <div>
          <h1 className="text-xl font-bold text-slate-800">Module 4 Performance Dashboard</h1>
          <p className="text-sm text-slate-500">Weekly balanced scorecard across hulls, trades, supervisors, and crews</p>
        </div>
      </div>
    </header>
  );
}

const EMPTY_FILTERS = { hulls: [], trades: [], supervisors: [], shifts: [], workPackages: [], weekStart: null, weekEnd: null };

function App() {
  const [trades, setTrades] = useState(() => loadFromStorage(TRADES_STORAGE_KEY, DEFAULT_TRADES));
  const [weights, setWeights] = useState(() => loadFromStorage(WEIGHTS_STORAGE_KEY, DEFAULT_WEIGHTS));
  const [records, setRecords] = useState(() => generateMockData(WEEK_COUNT, trades));
  const [usingImportedData, setUsingImportedData] = useState(false);
  const [filters, setFilters] = useState(EMPTY_FILTERS);
  const [rankBy, setRankBy] = useState("supervisor");
  const [settingsOpen, setSettingsOpen] = useState(false);

  useEffect(() => { localStorage.setItem(WEIGHTS_STORAGE_KEY, JSON.stringify(weights)); }, [weights]);
  useEffect(() => { localStorage.setItem(TRADES_STORAGE_KEY, JSON.stringify(trades)); }, [trades]);

  useEffect(() => {
    if (!usingImportedData) setRecords(generateMockData(WEEK_COUNT, trades));
  }, [trades, usingImportedData]);

  const allWeeks = useMemo(() => uniqueSorted(records.map((r) => r.week)), [records]);
  const allHulls = useMemo(() => uniqueSorted(records.map((r) => r.hull)), [records]);
  const allSupervisors = useMemo(() => uniqueSorted(records.map((r) => r.supervisor)), [records]);
  const allWorkPackages = useMemo(() => uniqueSorted(records.map((r) => r.workPackage)), [records]);
  const filterTradeOptions = useMemo(() => uniqueSorted([...trades, ...records.map((r) => r.trade)]), [trades, records]);

  const filteredRecords = useMemo(() => {
    return records.filter((r) => {
      if (filters.hulls.length > 0 && !filters.hulls.includes(r.hull)) return false;
      if (filters.trades.length > 0 && !filters.trades.includes(r.trade)) return false;
      if (filters.supervisors.length > 0 && !filters.supervisors.includes(r.supervisor)) return false;
      if (filters.shifts.length > 0 && !filters.shifts.includes(r.shift)) return false;
      if (filters.workPackages.length > 0 && !filters.workPackages.includes(r.workPackage)) return false;
      if (filters.weekStart && r.week < filters.weekStart) return false;
      if (filters.weekEnd && r.week > filters.weekEnd) return false;
      return true;
    });
  }, [records, filters]);

  const weeksInView = useMemo(() => uniqueSorted(filteredRecords.map((r) => r.week)), [filteredRecords]);
  const latestWeek = weeksInView.length > 0 ? weeksInView[weeksInView.length - 1] : null;

  const summary = useMemo(() => {
    if (!latestWeek) return null;
    const latestWeekRecords = filteredRecords.filter((r) => r.week === latestWeek);
    return aggregateAll(latestWeekRecords, weights);
  }, [filteredRecords, latestWeek, weights]);

  const trendData = useMemo(() => {
    const byWeek = new Map();
    for (const r of filteredRecords) {
      const arr = byWeek.get(r.week);
      if (arr) arr.push(r);
      else byWeek.set(r.week, [r]);
    }
    const points = [];
    for (const week of weeksInView) {
      const bucket = byWeek.get(week);
      if (!bucket) continue;
      const scored = aggregateAll(bucket, weights);
      if (scored) points.push({ ...scored, weekLabel: formatWeekLabel(week) });
    }
    return points;
  }, [filteredRecords, weeksInView, weights]);

  const rankingGroups = useMemo(() => groupAndScore(filteredRecords, rankBy, weights), [filteredRecords, rankBy, weights]);

  function handleAddTrade(trade) {
    setTrades((prev) => (prev.includes(trade) ? prev : [...prev, trade]));
  }

  function handleRemoveTrade(trade) {
    setTrades((prev) => prev.filter((t) => t !== trade));
    setFilters((prev) => ({ ...prev, trades: prev.trades.filter((t) => t !== trade) }));
  }

  function handleImportCsv(imported) {
    setRecords(imported);
    setUsingImportedData(true);
    setFilters(EMPTY_FILTERS);
  }

  function handleUseMockData() {
    setUsingImportedData(false);
    setRecords(generateMockData(WEEK_COUNT, trades));
    setFilters(EMPTY_FILTERS);
  }

  return (
    <div className="min-h-screen bg-slate-100">
      <Header />
      <main className="mx-auto max-w-7xl space-y-6 px-6 py-6">
        <FilterBar
          filters={filters}
          onFiltersChange={setFilters}
          weeks={allWeeks}
          hulls={allHulls}
          trades={filterTradeOptions}
          supervisors={allSupervisors}
          workPackages={allWorkPackages}
          rankBy={rankBy}
          onRankByChange={setRankBy}
          onOpenSettings={() => setSettingsOpen(true)}
        />

        <ScorecardSummary summary={summary} weekLabel={latestWeek ? formatWeekLabel(latestWeek) : ""} />

        <TrendCharts data={trendData} />

        <RankingTable groups={rankingGroups} dimension={rankBy} week={latestWeek} />
      </main>

      <SettingsPanel
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        weights={weights}
        onWeightsChange={setWeights}
        trades={trades}
        onAddTrade={handleAddTrade}
        onRemoveTrade={handleRemoveTrade}
        onImportCsv={handleImportCsv}
        onUseMockData={handleUseMockData}
        usingImportedData={usingImportedData}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
  </body>
